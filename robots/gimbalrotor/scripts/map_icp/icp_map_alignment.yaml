# Map-to-map registration configuration for the base-station ICP node.
#
# Registration itself is done between the map frames: each initial guess
# transforms coordinates from the follower map frame into the leader map frame.
# The accepted result is then composed with the static world-to-map offset that
# each robot broadcasts, and published as TF:
#   leader world frame -> follower world frame
#
# That single edge joins the per-robot TF trees, so every world_frame_name below
# must match the global_frame rosparam of the corresponding robot, and each robot
# must use a distinct one.

leader:
  topic: /gimbalrotor1/map
  world_frame_name: world

followers:
  - name: gimbalrotor2
    topic: /gimbalrotor2/map
    world_frame_name: world_2
    initial_guess:
      # These guesses are to be denoted in the leader map frame.
      translation: [3.0, 0.0, 0.0]
      # [roll, pitch, yaw] in radians.
      rotation_rpy: [0.0, 0.0, 0.0]

# When enabled, voxel downsampling is applied to both received maps before
# registration.  Fast-LIO maps that are already downsampled can set this to
# false.
downsample:
  enabled: false
  voxel_size: 0.5

registration:
  # point_to_plane ignores displacement along the matched surface, which is where
  # most of the disagreement between two maps lives: each robot voxelizes on a grid
  # anchored at its own origin, so the same wall is sampled at different points.
  # It needs normals on the leader map; normal_radius should be a few times
  # fast_lio's filter_size_map (0.5 m) and is unused by point_to_point.
  estimation_method: point_to_plane
  normal_radius: 1.5

  # ICP is run once per entry, coarse to fine, each stage starting from the previous
  # result.  A single loose pass leaves wrong correspondences that never get pruned.
  correspondence_schedule: [2.0, 1.0, 0.5, 0.25]

  max_iteration: 50
  relative_fitness: 1.0e-6
  relative_rmse: 1.0e-6
  min_points: 100

  # These describe the FINAL (tightest) stage of the schedule, not a 2.0 m pass, so
  # they are far stricter than the same numbers used to be: at 2.0 m essentially every
  # point has some neighbour and fitness is ~1.0 regardless of quality.  On the mocap
  # dataset good alignments score fitness 0.76 and RMSE 0.164 here.  Re-check against
  # the values logged on the real site, which is less favourable than the mocap room,
  # and loosen rather than letting the node reject everything.
  min_fitness: 0.40
  max_inlier_rmse: 0.40

  # PointCloud2 subscriber queue size and rate at which the last accepted
  # transform for each follower is rebroadcast on /tf.  Use a rate materially
  # higher than the expected map rate (for example, 50 Hz for 10 Hz maps) when
  # rollout is enabled.
  subscriber_queue_size: 1
  tf_publish_rate: 10.0

# The map-frame transform is assumed to be static.  When enabled, an
# error-state EKF filters successful ICP measurements in spatialmath's true
# SE(3) twist coordinates [v_x, v_y, v_z, omega_x, omega_y, omega_z].  The
# translation and rotation keys retain their intuitive names: their entries
# are respectively the linear-twist (m^2) and angular-twist (rad^2)
# variances.  Process entries are the corresponding variance rates per
# second.  The first accepted ICP result initializes the filter state.
filter:
  enabled: false
  type: error_state_ekf
  initial_covariance:
    translation: [0.25, 0.25, 0.25]
    rotation: [0.03, 0.03, 0.03]
  process_covariance:
    translation: [1.0e-5, 1.0e-5, 1.0e-5]
    rotation: [1.0e-6, 1.0e-6, 1.0e-6]
  measurement_covariance:
    translation: [0.10, 0.10, 0.10]
    rotation: [0.01, 0.01, 0.01]

# Smoothly transition from the currently published transform to each filtered
# target.  A new target restarts the trajectory from the current intermediate
# pose; targets are not queued.  The duration follows the preceding accepted
# estimate interval and is clamped to these limits.
rollout:
  enabled: false
  fallback_duration: 0.10
  minimum_duration: 0.02
  maximum_duration: 1.00
