# NMPC (acados) control config for the ynltilt airframe.
#
# Model: tilt_qd_servo_mdl, generated by
#   aerial_robot_control/scripts/nmpc/gen_nmpc_code.py -m NMPCTiltQdServo
# nx = 17 (p, v, q, w, a_s), nu = 8 (ft_c, a_c), np = 35 (q_ref + 31 physical params)
#
# NOTE: mass, gravity, inertia, rotor positions/directions and kq_d_kt are NOT read
# from here. TiltMtServoNMPC::PhysToNMPCParams() pulls them from the URDF through
# aerial_robot_model at activate() time. Only the actuator counts and the actuator
# time constants have to be given below.

mpc_solver_name: aerial_robot_control::mpc_solver::TiltQdServoMdlMPCSolver
aerial_robot_control_name: aerial_robot_control/nmpc_controller/tilt_mt/servo_nmpc

physical:
  num_rotors: 4
  num_servos: 4
  t_rotor: 0.0942  # rotor time constant [s] (unused by this model, kept for the param vector)
  t_servo: 0.16    # gimbal servo time constant [s]. Gazebo: damping 0.8 / P-gain 5.0 ~ 0.16 s.
                   # Re-identify on the real machine before flying it.

controller:
  vel_limit_takeoff: 1.0  # m/s, relaxed to v_max/v_min once HOVER_STATE is reached

  alloc:
    type: 0
    ft_thresh: 0.5

  nmpc:
    T_samp: 0.01   # MUST equal 1 / main_rate (100 Hz in bringup.launch); checked at startup
    T_horizon: 2.0  # MUST match robots/beetle/config/BeetleNMPCFull.yaml used at code-gen time
    T_step: 0.1     # ditto -- N_steps = 20 is baked into the generated solver

    # constraints
    w_max: 6   # rad/s
    w_min: -6

    v_max: 1   # m/s
    v_min: -1

    thrust_max: 18.0  # N, = <limit upper> of the rotor joint in urdf/ynltilt/common.xacro
    thrust_min: 2.0   # N, = motor_info/min_thrust of MotorInfo_9inch.yaml (spinal clamps below this)

    a_max: 1.4   # rad, gimbal joint limit is +-2.0 in urdf/ynltilt/common.xacro
    a_min: -1.4

    # cost function weights
    Qp_xy: 300
    Qp_z: 400
    Qv_xy: 10
    Qv_z: 10
    Qq_xy: 300
    Qq_z: 600
    Qw_xy: 5
    Qw_z: 5
    Qa: 1
    Rt: 1
    Rac_d: 250  # penalty on (a_c - a_s)

    is_attitude_ctrl: false
    is_body_rate_ctrl: false

    is_print_phys_params: true
    is_debug: false
