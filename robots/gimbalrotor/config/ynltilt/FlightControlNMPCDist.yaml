# NMPC (acados) control config for the ynltilt airframe -- disturbance/I-term model.
#
# Model: tilt_qd_servo_dist_mdl, generated by
#   aerial_robot_control/scripts/nmpc/gen_nmpc_code.py -m NMPCTiltQdServoDist
# nx = 23 (p, v, q, w, a_s, f_dist_w, tau_dist_b), nu = 8 (ft_c, a_c),
# np = 41 (q_ref + 31 physical params + 6 disturbance params)
#
# Difference from FlightControlNMPC.yaml: 6 extra disturbance states and 6 extra
# disturbance parameters. The parameters are driven by WrenchEstITerm (always loaded,
# see TiltMtServoDistNMPC::prepareNMPCParams) and remove the steady-state position
# error the plain tilt_qd_servo_mdl leaves when holding a tilted attitude.
#
# As with FlightControlNMPC.yaml, mass/gravity/inertia/rotor geometry/kq_d_kt come from
# the URDF at activate() via TiltMtServoNMPC::PhysToNMPCParams(); only the actuator
# counts and time constants are given here.

mpc_solver_name: aerial_robot_control::mpc_solver::TiltQdServoDistMdlMPCSolver
aerial_robot_control_name: aerial_robot_control/nmpc_controller/tilt_mt/servo_dist_nmpc

physical:
  num_rotors: 4
  num_servos: 4
  t_rotor: 0.0942  # rotor time constant [s] (unused by this model, kept for the param vector)
  t_servo: 0.16    # gimbal servo time constant [s]. Gazebo: damping 0.8 / P-gain 5.0 ~ 0.16 s.
                   # Re-identify on the real machine before flying it.

controller:
  vel_limit_takeoff: 1.0  # m/s, relaxed to v_max/v_min once HOVER_STATE is reached

  # Estimated external wrench is NOT fed to the controller; only the I-term is.
  # Set true (and pick a wrench_estimator_name) once an estimator is validated here.
  if_use_est_wrench_4_control: false

  # I-term gains. WrenchEstITerm integrates the NMPC's one-control-period prediction
  # error, which is tiny (~70 um under a 3 N disturbance at 100 Hz), so the wind-up rate
  # is roughly i_gain * 7e-5 N/s. The code fallback of 1.0 leaves the term inert; these
  # values reject a steady 3 N in ~30 s (verified in Gazebo: 256 mm offset -> 3 mm).
  i_term:
    i_gain_x: 1000
    i_gain_y: 1000
    i_gain_z: 1000
    i_gain_roll: 500
    i_gain_pitch: 500
    i_gain_yaw: 500
    limit_fx: 5.0   # N
    limit_fy: 5.0
    limit_fz: 10.0  # larger: absorbs mass error on top of disturbance
    limit_mx: 1.0   # Nm
    limit_my: 1.0
    limit_mz: 1.0

  alloc:
    # type 1 (heuristic) flips a rotor backwards past +-90 deg when its thrust drops
    # below ft_thresh. ynltilt's gimbals are limited to +-2.0 rad by the URDF, so the
    # flip cannot complete -- keep the pseudo-inverse allocation.
    type: 0
    ft_thresh: 0.5

  nmpc:
    T_samp: 0.01    # MUST equal 1 / main_rate (100 Hz in bringup.launch); checked at startup
    T_horizon: 2.0  # MUST match robots/beetle_omni/config/BeetleNMPCFullDist.yaml (code-gen)
    T_step: 0.1     # ditto -- N_steps = 20 is baked into the generated solver

    # constraints
    w_max: 6   # rad/s
    w_min: -6

    v_max: 1   # m/s
    v_min: -1

    thrust_max: 18.0  # N, = <limit upper> of the rotor joint in urdf/ynltilt/common.xacro
    thrust_min: 2.0   # N, = motor_info/min_thrust of MotorInfo_9inch.yaml (spinal clamps below this)

    a_max: 1.9   # rad, gimbal joint limit is +-2.0 in urdf/ynltilt/common.xacro
    a_min: -1.9

    # cost function weights
    Qp_xy: 300
    Qp_z: 400
    Qv_xy: 10
    Qv_z: 10
    Qq_xy: 300
    Qq_z: 600
    Qw_xy: 5
    Qw_z: 5
    Qa: 2
    Rt: 2
    Rac_d: 250  # penalty on (a_c - a_s)

    is_attitude_ctrl: false
    is_body_rate_ctrl: false

    is_print_phys_params: true
    is_debug: false
